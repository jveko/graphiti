services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379" # Redis protocol port
      - "3000" # Web interface port
    environment:
      - REDIS_ARGS=${FALKORDB_PASSWORD:+--requirepass $FALKORDB_PASSWORD}
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli ${FALKORDB_PASSWORD:+-a $FALKORDB_PASSWORD} ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dokploy-network

  graphiti-mcp:
    image: zepai/knowledge-graph-mcp:latest
    build:
      context: .
      dockerfile: Dockerfile-new
    env_file:
      - .env
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - FALKORDB_USERNAME=${FALKORDB_USERNAME:-}
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
      - FALKORDB_DATABASE=${FALKORDB_DATABASE:-default_db}
    ports:
      - "3000" # Expose the MCP server via HTTP for SSE transport
      - "8000"
    command:
      [
        "uv",
        "run",
        "graphiti_mcp_server_new.py",
        "--transport",
        "streamable-http",
      ]
    networks:
      - dokploy-network

volumes:
  falkordb_data:

networks:
  dokploy-network:
    external: true
